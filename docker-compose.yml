services:
  postgres:
    container_name: postgres_order
    image: postgres:16.4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orders"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: my_pass
      POSTGRES_DB: orders
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    build: 
      context: .
      target: my-build
    command: go run migrations/auto.go
    env_file:
      .env
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    ports:
      - "8081:8081"
    env_file:
      - .env
    depends_on:
       postgres:
        condition: service_healthy
       migrate:
        condition: service_completed_successfully

volumes:
  pgdata: